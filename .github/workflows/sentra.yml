name: Deploy sentra

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-sentra-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NEXT_TELEMETRY_DISABLED: "1"

      SERVER_HOST: webschere.de
      SERVER_USER: deploy

      SENTRA_SERVER_PATH: /data/sentra/sentra
      LEGACY_SENTRA_SERVER_PATH: /home/deploy/sentra/sentra
      AUTH_SERVER_PATH: /home/deploy/sentra/authServer
      MICROSERVICE_PATH: /home/deploy/sentra/microservice
      RELEASE_DIR: sentra-release
      AUTH_IMAGE_NAME: sentra-authserver
      LIVETALK_IMAGE_NAME: sentra-livetalk

      PUBLIC_BASE_URL: https://webschere.de
      AUTH_PUBLIC_URL: https://webschere.de
      LIVETALK_PUBLIC_URL: https://webschere.de

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sentra/package-lock.json

      - name: Write sentra build environment file
        working-directory: sentra
        run: |
          cat > .env.production <<EOF
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          POSTGRES_URL=${{ secrets.POSTGRES_URL }}

          AUTH_HOST=${AUTH_PUBLIC_URL}
          NEXT_PUBLIC_AUTH_HOST=${AUTH_PUBLIC_URL}

          LIVETALK_JWT_SECRET=${{ secrets.LIVETALK_JWT_SECRET }}
          NEXT_PUBLIC_LIVETALK_SOCKET_URL=${LIVETALK_PUBLIC_URL}

          AUTH_CLIENT_ID=${{ secrets.AUTH_CLIENT_ID }}
          AUTH_API_KEY=${{ secrets.AUTH_API_KEY }}
          EOF

      - name: Install sentra dependencies
        working-directory: sentra
        run: npm ci

      - name: Build sentra standalone bundle
        working-directory: sentra
        run: npm run build

      - name: Assemble sentra release bundle
        run: |
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR/.next"
          cp -R sentra/.next/standalone/. "$RELEASE_DIR/"
          cp -R sentra/.next/static "$RELEASE_DIR/.next/static"
          cp -R sentra/public "$RELEASE_DIR/public"
          cp sentra/package.json "$RELEASE_DIR/package.json"

      - name: Derive image coordinates
        id: image_vars
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image_namespace=$owner" >> "$GITHUB_OUTPUT"
          echo "image_tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "auth_image=ghcr.io/$owner/$AUTH_IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "livetalk_image=ghcr.io/$owner/$LIVETALK_IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push auth server image
        uses: docker/build-push-action@v6
        with:
          context: ./authServer
          file: ./authServer/Dockerfile
          push: true
          tags: |
            ${{ steps.image_vars.outputs.auth_image }}:${{ steps.image_vars.outputs.image_tag }}
            ${{ steps.image_vars.outputs.auth_image }}:latest

      - name: Build and push livetalk image
        uses: docker/build-push-action@v6
        with:
          context: ./microservice/livetalk
          file: ./microservice/livetalk/Dockerfile
          push: true
          tags: |
            ${{ steps.image_vars.outputs.livetalk_image }}:${{ steps.image_vars.outputs.image_tag }}
            ${{ steps.image_vars.outputs.livetalk_image }}:latest

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Prepare remote directories and clean sentra target
        run: |
          ssh -i ~/.ssh/id_rsa "$SERVER_USER@$SERVER_HOST" <<EOF
          set -euo pipefail
          mkdir -p "$SENTRA_SERVER_PATH" "$AUTH_SERVER_PATH" "$MICROSERVICE_PATH"

          if [ -f "$LEGACY_SENTRA_SERVER_PATH/.env" ] && [ ! -f "$SENTRA_SERVER_PATH/.env" ]; then
            cp "$LEGACY_SENTRA_SERVER_PATH/.env" "$SENTRA_SERVER_PATH/.env"
          fi

          if [ -d "$LEGACY_SENTRA_SERVER_PATH" ]; then
            find "$LEGACY_SENTRA_SERVER_PATH" -mindepth 1 -maxdepth 1 ! -name '.env' -exec rm -rf {} +
          fi

          find "$SENTRA_SERVER_PATH" -mindepth 1 -maxdepth 1 ! -name '.env' -exec rm -rf {} +
          EOF

      - name: Upload sentra release and companion services
        run: |
          rsync -az \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/id_rsa" \
            "$RELEASE_DIR/" "$SERVER_USER@$SERVER_HOST:$SENTRA_SERVER_PATH/"

          rsync -az --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/id_rsa" \
            authServer/ "$SERVER_USER@$SERVER_HOST:$AUTH_SERVER_PATH/"

          rsync -az --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'mosquitto/data/' \
            --exclude 'mosquitto/log/' \
            -e "ssh -i ~/.ssh/id_rsa" \
            microservice/ "$SERVER_USER@$SERVER_HOST:$MICROSERVICE_PATH/"

      - name: Pull service images on server and restart sentra
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_NAMESPACE: ${{ steps.image_vars.outputs.image_namespace }}
          IMAGE_TAG: ${{ steps.image_vars.outputs.image_tag }}
        run: |
          ssh -i ~/.ssh/id_rsa "$SERVER_USER@$SERVER_HOST" <<EOF
          set -euo pipefail

          if [ -n "${GHCR_USERNAME:-}" ] && [ -n "${GHCR_TOKEN:-}" ]; then
            printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          fi

          export IMAGE_REGISTRY="ghcr.io"
          export IMAGE_NAMESPACE="$IMAGE_NAMESPACE"
          export IMAGE_TAG="$IMAGE_TAG"

          cd "$AUTH_SERVER_PATH"
          docker compose pull app
          docker compose up -d --remove-orphans

          cd "$MICROSERVICE_PATH"
          docker compose pull livetalk
          docker compose up -d --remove-orphans

          docker builder prune -af || true
          docker image prune -af --filter "until=168h" || true

          mkdir -p /data/sentra/.pm2/logs
          if [ -d "/home/deploy/.pm2" ] && [ ! -L "/home/deploy/.pm2" ]; then
            cp -a "/home/deploy/.pm2/." /data/sentra/.pm2/ || true
            rm -rf "/home/deploy/.pm2"
          fi
          if [ ! -e "/home/deploy/.pm2" ]; then
            ln -s /data/sentra/.pm2 "/home/deploy/.pm2"
          fi
          find "/home/deploy/.pm2/logs" -type f -name '*.log' -exec truncate -s 0 {} + || true

          pm2 delete sentra || true
          pm2 start "$SENTRA_SERVER_PATH/server.js" --name sentra --cwd "$SENTRA_SERVER_PATH"
          pm2 save || true
          EOF

