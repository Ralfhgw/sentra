services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554" # RTSP (Server-Ausgang)
      - "1935:1935" # RTMP
      - "8888:8888" # HLS (Browser-tauglich!)
      - "8889:8889" # WebRTC (Niedrige Latenz)
      - "9997:9997" # API Port access from extern
    volumes:
      - ./mediamtx.yml:/mediamtx.yml

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: always
    ports:
      - "1883:1883"   # MQTT
      #- "9001:9001"   # MQTT über WebSockets
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  db:
    image: postgres:15-alpine
    container_name: microservice_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./init_sentra.sql:/docker-entrypoint-initdb.d/init.sql
      - ./day_meanings_export.csv:/docker-entrypoint-initdb.d/day_meanings_export.csv
      - ./liveview_channels.csv:/docker-entrypoint-initdb.d/liveview_channels.csv

  livetalk:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-ralfhgw}/sentra-livetalk:${IMAGE_TAG:-latest}
    container_name: livetalk
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PORT: 3011
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LIVETALK_JWT_SECRET: ${LIVETALK_JWT_SECRET}
      CORS_ORIGIN: ${SENTRA_PUBLIC_URL}
      MEDIASOUP_LISTEN_IP: 0.0.0.0
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP}
      MEDIASOUP_RTC_MIN_PORT: 40000
      MEDIASOUP_RTC_MAX_PORT: 40100
      MEDIASOUP_WORKER_COUNT: 1
      CHAT_HISTORY_LIMIT: 50
    ports:
      - "3011:3011"
      - "40000-40100:40000-40100/udp"
      - "40000-40100:40000-40100/tcp"

  coturn:
    image: coturn/coturn:4.9.0
    container_name: coturn
    restart: unless-stopped
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    command:
      - -n
      - --log-file=stdout
      - --no-cli
      - --no-tls
      - --no-dtls
      - --realm=sentra.local
      - --use-auth-secret
      - --static-auth-secret=${LIVETALK_JWT_SECRET}
      - --fingerprint
      - --listening-ip=0.0.0.0
      - --external-ip=${PUBLIC_IP}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200

volumes:
  pg-data:

