services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pass}
      - POSTGRES_DB=${POSTGRES_DB:-authdb}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build: .
    container_name: node_container
    restart: unless-stopped
    ports:
      - "${AUTH_SERVER_PORT:-3001}:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://user:pass@db:5432/authdb}
      - JWT_SECRET=${JWT_SECRET:-mein_geheimnis}
      - REFRESH_SECRET=${REFRESH_SECRET:-mein_super_geheimnis_fuer_refresh}
      - PORT=${PORT:-3000}
      - NODE_ENV=${NODE_ENV:-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      - db

volumes:
  pg-data:

